name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Throwaway Postgres for integration tests (RLS needs a restricted role, which we create).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

      - name: Integration tests (migrations + RLS as a restricted role)
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" \
            -c "create role crm_owner login password 'owner_pw' createdb" \
            -c "create role crm_app login password 'app_pw' nosuperuser nobypassrls" \
            -c "create database crm owner crm_owner"
          pnpm db:migrate
          pnpm test:integration
        env:
          DATABASE_URL_OWNER: postgres://crm_owner:owner_pw@localhost:5432/crm
          DATABASE_URL: postgres://crm_app:app_pw@localhost:5432/crm
      - run: pnpm audit --prod --audit-level=high

      # A fresh Neon branch per run so tests never touch the main database.
      - name: Create Neon branch
        id: neon
        if: env.NEON_PROJECT_ID != ''
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          username: ${{ secrets.NEON_APP_ROLE }}
          database: neondb

      # No migrations exist until the first tables land in Phase 1.
      - name: Apply migrations (owner role)
        if: steps.neon.outcome == 'success' && hashFiles('src/db/migrations/meta/_journal.json') != ''
        run: pnpm db:migrate
        env:
          DATABASE_URL_OWNER: ${{ steps.neon.outputs.db_url }}
          # The Neon CI branch only serves the health check, so the branch role doubles as app role.
          APP_DB_ROLE: ${{ secrets.NEON_APP_ROLE }}

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # E2E runs against the Postgres service (migrated, with the restricted app role) so the
      # activation/sign-in flows exercise real RLS. The Neon branch above validates that the
      # migrations apply cleanly on Neon itself.
      - run: pnpm e2e
        env:
          CI: "true"
          DATABASE_URL: postgres://crm_app:app_pw@localhost:5432/crm
          DATABASE_URL_OWNER: postgres://crm_owner:owner_pw@localhost:5432/crm

      - name: Delete Neon branch
        if: always() && steps.neon.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
